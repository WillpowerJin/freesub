proxy-providers:
  前置订阅:
    type: http
    url: https://yx.jinjin909.ggff.net/633a113e-af18-4142-859b-e2ebae6d726e/sub?target=clash
    interval: 3600
    proxy: DIRECT
    header:
      User-Agent:
      - clash.meta
    override:
      additional-prefix: 前置|
      udp: true
      ip-version: ipv4
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
  全部套链:
    type: http
    url: https://cdn.jsdelivr.net/gh/WillpowerJin/freesub@main/output/clash.yaml?v=1789661613
    interval: 21600
    proxy: DIRECT
    header:
      User-Agent:
      - clash.meta
    override:
      additional-prefix: 套链|
      dialer-proxy: 前置选择
      udp: true
      ip-version: ipv4
    exclude-type: hysteria2|hysteria|tuic|anytls|wireguard
    exclude-filter: (?i)hysteria|hy2|tuic|anytls
    health-check:
      enable: true
      lazy: true
      url: https://www.gstatic.com/generate_204
      interval: 600
proxy-groups:
- name: 前置选择
  type: select
  proxies:
  - 前置自动
  - 兜底|cm优选1
  - 兜底|visa中国
  - DIRECT
  use:
  - 前置订阅
  exclude-filter: Trojan
- name: 前置自动
  type: url-test
  url: https://www.gstatic.com/generate_204
  interval: 120
  tolerance: 50
  lazy: false
  proxies:
  - 兜底|cm优选1
  - 兜底|visa中国
  use:
  - 前置订阅
  exclude-filter: Trojan
- name: 家宽自动
