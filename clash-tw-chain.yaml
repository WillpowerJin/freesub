proxy-groups:
- name: 前置选择
  type: select
  proxies:
  - 前置自动
  - 兜底|cm优选1
  - 兜底|visa中国
  - DIRECT
  use:
  - 前置订阅
  exclude-filter: Trojan
- name: 前置自动
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 30
  timeout: 2000
  max-failed-times: 2
  tolerance: 150
  lazy: false
  proxies:
  - 兜底|cm优选1
