# 前置链式订阅 · Clash Meta / Mihomo（iOS + Android）
# 本机 → 前置订阅(直连下载) → 家宽/节点 → 目标
# 原版 Clash、Shadowrocket、Quantumult X 不能用。
# 前置选择请选「前置自动」。Hysteria2/TUIC 已排除。
# 自动组: HTTP 探测 / timeout 2s / 失败 2 次即换 / 家宽与台湾每 30s 测一次。
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
tcp-concurrent: true
unified-delay: true
find-process-mode: 'off'
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - +.qq.com
  - +.weixin.qq.com
  - +.wechat.com
  - +.qpic.cn
  - +.qlogo.cn
  - +.tenpay.com
  - localhost.ptlogin2.qq.com
  default-nameserver:
  - 223.5.5.5
  - 8.8.8.8
  nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query
  - tls://223.5.5.5
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
  - any:53
sniffer:
  enable: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports:
      - 80
      - 8080-8880
      override-destination: true
    TLS:
      ports:
      - 443
      - 8443
proxies:
- name: 兜底|cm优选1
