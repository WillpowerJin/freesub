  port: 443
  uuid: 633a113e-af18-4142-859b-e2ebae6d726e
  udp: true
  tls: true
  alpn:
  - h3
  skip-cert-verify: false
  servername: yx.jinjin909.ggff.net
  client-fingerprint: chrome
  network: ws
  ws-opts:
    path: /?ed=2048
    headers:
