    type: http
    url: https://yx.jinjin909.ggff.net/633a113e-af18-4142-859b-e2ebae6d726e/sub?target=clash
    interval: 3600
    proxy: DIRECT
    header:
      User-Agent:
      - clash.meta
    override:
      additional-prefix: 前置|
      udp: true
      ip-version: ipv4
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 60
      timeout: 2000
      lazy: false
  全部套链:
    type: http
    url: https://cdn.jsdelivr.net/gh/WillpowerJin/freesub@main/output/clash.yaml?v=1790455309
    interval: 21600
    proxy: DIRECT
    header:
      User-Agent:
      - clash.meta
    override:
      additional-prefix: 套链|
      dialer-proxy: 前置选择
      udp: true
      ip-version: ipv4
    exclude-type: hysteria2|hysteria|tuic|anytls|wireguard
    exclude-filter: (?i)hysteria|hy2|tuic|anytls
    health-check:
      enable: true
      lazy: true
      url: http://www.gstatic.com/generate_204
      interval: 180
